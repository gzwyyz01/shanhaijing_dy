# 抖音云托管 - Nginx 静态站点配置（抖音云要求监听 8000 端口）
server {
    listen       8000;
    server_name  _;
    root         /opt/application;
    index        preview.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 游戏静态资源
    location / {
        try_files $uri $uri/ /preview.html;
    }

    # 缓存策略：js 小改频繁，短缓存；其余默认
    location ~* \.(js|css|png|jpg|svg|json)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
